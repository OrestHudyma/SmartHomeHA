- id: asus_display_brightness_schedule
  alias: ASUS - Day/Night brightness
  description: Follow Night mode; restore brightness after HA or ASUS reconnects.
  triggers:
    - trigger: state
      entity_id: schedule.night_mode
      to: 'on'
    - trigger: state
      entity_id: schedule.night_mode
      to: 'off'
    - trigger: homeassistant
      event: start
    - trigger: mqtt
      topic: wallpanel/asus/brightness/availability
      payload: online
    - trigger: mqtt
      topic: homeassistant/status
      payload: online
    - trigger: time_pattern
      minutes: '/5'
  conditions:
    - condition: template
      value_template: "{{ states('schedule.night_mode') in ['on', 'off'] }}"
  actions:
    - action: mqtt.publish
      data:
        topic: wallpanel/asus/brightness/set
        payload: "{{ 15 if is_state('schedule.night_mode', 'on') else 100 }}"
        qos: 1
        retain: true
  mode: restart
